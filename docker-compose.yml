services:
  middleware-api:
    container_name: middleware-api
    build:
      context: .
      dockerfile: DataMiddleware/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080

  data-generator:
    container_name: data-generator
    build:
      context: ./DataGenerator
      dockerfile: Dockerfile
    environment:
      - TARGET_URL=http://middleware-api:8080/api/logs
    depends_on:
      - middleware-api